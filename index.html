<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXA - Azərbaycanın Rəqəmsal Evi</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-main: #020512;
            --bg-box: #0b122c;
            --bg-input: #101b42;
            --accent-blue: #3b82f6;
            --accent-glow: #00d2ff;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-main); color: var(--text-color); display: flex; justify-content: center; background-image: radial-gradient(circle at 50% 10%, #111e4a 0%, var(--bg-main) 70%); min-height: 100vh; overflow-x: hidden; }

        .phone-container { width: 100%; max-width: 430px; height: 100vh; background: var(--bg-main); position: relative; display: flex; flex-direction: column; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; box-shadow: 0 0 40px rgba(0, 210, 255, 0.05); }

        .page { display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden; padding-bottom: 65px; }
        .page.active { display: flex; }

        /* --- GİRİŞ & QEYDİYYAT --- */
        .auth-screen { padding: 30px; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        .logo-area { text-align: center; margin-bottom: 40px; }
        .nexa-logo-svg { width: 90px; height: auto; margin-bottom: 10px; filter: drop-shadow(0px 0px 15px rgba(0,210,255,0.6)); }
        .brand-name { font-size: 28px; font-weight: 800; letter-spacing: 5px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); font-style: italic; }
        .auth-box { width: 100%; background: var(--bg-box); padding: 25px; border-radius: 24px; border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); }
        .auth-box h2 { text-align: center; margin-bottom: 20px; font-weight: 700; }
        .auth-box input { width: 100%; padding: 14px; margin: 10px 0; background: var(--bg-input); border: 1px solid rgba(59, 130, 246, 0.4); color: white; border-radius: 12px; font-size: 15px; }
        .auth-box input:focus { border-color: var(--accent-glow); outline: none; }
        .auth-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-blue), #1d4ed8); border: none; color: white; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .toggle-txt { font-size: 13px; cursor: pointer; color: var(--accent-glow); text-align: center; margin-top: 18px; }

        /* --- HEADER --- */
        .app-header { height: 60px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; background: rgba(2, 5, 18, 0.85); backdrop-filter: blur(10px); flex-shrink: 0; }
        .app-header .logo { font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #fff; }
        .app-header .header-actions i { font-size: 20px; color: white; margin-left: 18px; cursor: pointer; }

        .scrollable-content { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }

        /* STORIES (24 saatlıq hekayə sistemi) */
        .stories-container { display: flex; padding: 15px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); overflow-x: auto; gap: 14px; scrollbar-width: none; }
        .story-wrapper { display: flex; flex-direction: column; align-items: center; min-width: 68px; cursor: pointer; }
        .story-avatar-box { width: 64px; height: 64px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #00d2ff, #3b82f6, #9333ea); display: flex; justify-content: center; align-items: center; }
        .story-avatar-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-main); }
        .story-wrapper span { font-size: 11px; margin-top: 6px; max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .mavi-tik { color: #38bdf8; font-size: 12px; margin-left: 4px; }

        /* POSTLAR */
        .post-card { background: rgba(11, 18, 44, 0.4); margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .post-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
        .post-user-info { display: flex; align-items: center; }
        .post-user-img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
        .post-username { font-size: 14px; font-weight: 600; display: flex; align-items: center; }
        .post-caption { padding: 0 16px 10px 16px; font-size: 14px; color: #e5e7eb; }
        .post-media-container { width: 100%; background: #000; position: relative; }
        .post-media { width: 100%; height: auto; max-height: 400px; object-fit: cover; display: block; }
        .post-actions { display: flex; padding: 12px 16px; gap: 20px; font-size: 14px; }
        .action-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }

        /* --- NAVBAR --- */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 65px; background: rgba(2, 5, 18, 0.92); backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-btn { color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 10px; }
        .nav-btn.active { color: white; filter: drop-shadow(0 0 8px var(--accent-blue)); }

        /* --- AXTARIŞ (EXPLORE) SƏHİFƏSİ --- */
        .search-box { padding: 12px 16px; }
        .search-input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid rgba(59,130,246,0.3); border-radius: 10px; color: white; font-size: 14px; }
        .user-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .user-list-info { display: flex; align-items: center; }
        .follow-btn { padding: 6px 14px; background: var(--accent-blue); border: none; color: white; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .follow-btn.following { background: #374151; }

        /* --- PAYLAŞIM EKRANI --- */
        .share-screen { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .share-screen textarea { width: 100%; height: 100px; background: var(--bg-input); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; color: white; padding: 12px; resize: none; }
        .file-upload-btn { padding: 12px; background: #1e293b; border: 1px dashed var(--accent-blue); text-align: center; border-radius: 12px; cursor: pointer; font-size: 14px; }

        /* --- REELS SƏHİFƏSİ --- */
        .reels-container { height: 100%; overflow-y: scroll; snap-type: y mandatory; scrollbar-width: none; }
        .reels-container::-webkit-scrollbar { display: none; }
        .reel-video-wrapper { width: 100%; height: 100%; snap-align: start; position: relative; background: #000; }
        .reel-video { width: 100%; height: 100%; object-fit: cover; }
        .reel-overlay { position: absolute; bottom: 20px; left: 15px; right: 15px; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* --- MESAJLAŞMA (CHAT) SƏHİFƏSİ --- */
        .chat-users-list { display: flex; flex-direction: column; }
        .chat-window { display: flex; flex-direction: column; height: 100%; background: var(--bg-main); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-bubble.sent { background: var(--accent-blue); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-bubble.received { background: var(--bg-box); color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-row { display: flex; padding: 12px; background: var(--bg-box); border-top: 1px solid rgba(255,255,255,0.08); gap: 10px; align-items: center; }
        .chat-input-row input { flex: 1; padding: 12px; background: var(--bg-input); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; }
        .chat-input-row button { padding: 12px 16px; background: var(--accent-blue); border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .audio-btn { background: #1e293b !important; color: #ef4444 !important; font-size: 16px; }
        .audio-btn.recording { background: #ef4444 !important; color: white !important; animation: pulse 1s infinite; }

        /* --- PROFİL SƏHİFƏSİ --- */
        .profile-screen { overflow-y: auto; padding-bottom: 20px; height: 100%; }
        .profile-header { padding: 20px 16px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .profile-avatar-main { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-blue); }
        .profile-name-title { font-size: 20px; font-weight: 700; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
        .profile-bio { font-size: 13px; color: var(--text-muted); margin-top: 6px; padding: 0 20px; line-height: 1.4; }
        .profile-stats { display: flex; justify-content: center; gap: 30px; margin-top: 15px; background: rgba(11, 18, 44, 0.5); padding: 12px; border-radius: 12px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--text-muted); }
        .stat-item strong { font-size: 16px; color: white; }
        
        .profile-edit-section { padding: 15px; background: rgba(255,255,255,0.02); border-radius: 12px; margin: 12px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(59,130,246,0.1); }
        .profile-edit-section input, .profile-edit-section textarea { padding: 10px; background: var(--bg-input); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 13px; }
        .profile-posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 10px 16px; }
        .grid-media-item { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #000; border-radius: 4px; cursor: pointer; }

        .admin-trigger-btn { margin: 15px auto 0 auto; padding: 8px 16px; background: transparent; border: 1px solid #ef4444; color: #ef4444; border-radius: 20px; font-size: 12px; cursor: pointer; display: none; font-weight: bold; }

        /* --- ADMİN --- */
        .admin-screen { padding: 20px; overflow-y: auto; }
        .user-manage-card { background: var(--bg-box); padding: 16px; border-radius: 16px; margin-bottom: 12px; }
        .admin-control-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 14px; }
        .admin-btn-sm { padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .num-input { width: 70px; padding: 4px; background: var(--bg-main); border: 1px solid var(--accent-blue); color: white; text-align: center; border-radius: 4px; }

        /* --- ZƏNG MODAL sistemi --- */
        .call-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2,5,18,0.96); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 40px; }
        .call-avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent-glow); margin-bottom: 20px; object-fit: cover; }
        .call-status { font-size: 14px; color: var(--accent-glow); margin-top: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .call-actions { display: flex; gap: 30px; margin-top: 60px; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; color: white; cursor: pointer; border: none; }
        .call-btn.decline { background: #ef4444; }
        #local-video-stream { width: 100%; height: 100%; position: absolute; top:0; left:0; object-fit: cover; z-index: -1; display: none; }

        /* STORY DETAL MODAL */
        .story-view-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 500; display: none; flex-direction: column; }
        .story-progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.3); position: absolute; top: 10px; left: 0; }
        .story-progress-fill { height: 100%; width: 0%; background: var(--accent-glow); transition: width 4.8s linear; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="phone-container">

    <div id="call-screen" class="call-modal">
        <video id="local-video-stream" autoplay muted playsinline></video>
        <img id="call-screen-img" src="" class="call-avatar">
        <h2 id="call-screen-name">İstifadəçi</h2>
        <div class="call-status" id="call-status-text">Zəng olunur...</div>
        <div class="call-actions">
            <button class="call-btn decline" onclick="endSimulatedCall()"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <div id="story-viewer" class="story-view-modal" onclick="closeStoryViewer()">
        <div class="story-progress-bar"><div id="story-progress-fill" class="story-progress-fill"></div></div>
        <div style="padding: 20px; display:flex; align-items:center; gap:10px; z-index:10; background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent)">
            <img id="story-viewer-avatar" src="" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
            <strong id="story-viewer-name"></strong>
        </div>
        <img id="story-viewer-img" src="" style="width:100%; height:100%; object-fit:contain; flex:1;">
    </div>

    <div id="page-auth" class="page active">
        <div class="auth-screen">
            <div class="logo-area">
                <svg class="nexa-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 55C25 35 38 35 45 48C52 62 65 62 80 38" stroke="url(#paint0_linear)" stroke-width="8" stroke-linecap="round"/>
                    <path d="M50 15L52 28L65 30L52 32L50 45L48 32L35 30L48 28Z" fill="#00d2ff"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="20" y1="45" x2="80" y2="45" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#9ca3af"/> <stop offset="0.5" stop-color="#ffffff"/> <stop offset="1" stop-color="#4b5563"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="brand-name">NEXA</div>
                <div style="font-size: 11px; color: var(--accent-glow); letter-spacing: 2px; margin-top: 5px;">AZƏRBAYCANIN RƏQƏMSAL EVİ</div>
            </div>
            <div class="auth-box">
                <h2 id="title">Giriş</h2>
                <input type="text" id="user" placeholder="İstifadəçi adı">
                <input type="password" id="pass" placeholder="Şifrə">
                <button onclick="authAction()" id="btn">Daxil ol</button>
                <p onclick="toggleMode()" id="toggle-text" class="toggle-txt">Hesabın yoxdur? Qeydiyyatdan keç</p>
            </div>
        </div>
    </div>

    <div id="page-feed" class="page">
        <div class="app-header">
            <div class="logo">NEXA</div>
            <div class="header-actions">
                <i class="fa-regular fa-paper-plane" onclick="switchPage('chatlist')"></i>
            </div>
        </div>
        <div class="scrollable-content">
            <div class="stories-container" id="stories-box"></div>
            <div id="posts-box"></div>
        </div>
    </div>

    <div id="page-explore" class="page">
        <div class="search-box">
            <input type="text" id="search-input-field" class="search-input" placeholder="İstifadəçi adı axtar..." oninput="handleSearch()">
        </div>
        <div class="scrollable-content" id="search-results-box"></div>
    </div>

    <div id="page-share" class="page">
        <div class="app-header"><div class="logo">Yeni Paylaşım</div></div>
        <div class="share-screen">
            <textarea id="post-caption-input" placeholder="Açıqlama yaz..."></textarea>
            <label class="file-upload-btn">
                <i class="fa-solid fa-cloud-arrow-up"></i> Qalereyadan Şəkil/Video Seç
                <input type="file" id="post-file-input" accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">
            </label>
            <div id="file-preview-status" style="font-size:12px; color:var(--accent-glow); text-align:center;"></div>
            <button onclick="submitPost()" style="background: var(--accent-blue); color:white; padding:14px; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Paylaşımı Tamamla</button>
        </div>
    </div>

    <div id="page-reels" class="page">
        <div class="reels-container" id="reels-box"></div>
    </div>

    <div id="page-chatlist" class="page">
        <div class="app-header">
            <div class="logo">Mesajlar</div>
            <div class="header-actions"><i class="fa-solid fa-house" onclick="switchPage('feed')"></i></div>
        </div>
        <div class="scrollable-content chat-users-list" id="chat-users-box"></div>
    </div>

    <div id="page-chatwindow" class="page">
        <div class="app-header">
            <div class="logo" id="chat-target-title">Çat</div>
            <div class="header-actions">
                <i class="fa-solid fa-phone" style="font-size:16px; margin-right:12px; color:var(--accent-glow); cursor:pointer;" onclick="startCall('voice')"></i>
                <i class="fa-solid fa-video" style="font-size:16px; margin-right:15px; color:var(--accent-blue); cursor:pointer;" onclick="startCall('video')"></i>
                <i class="fa-solid fa-chevron-left" onclick="switchPage('chatlist')"></i>
            </div>
        </div>
        <div class="chat-window">
            <div class="chat-messages" id="chat-messages-box"></div>
            <div class="chat-input-row">
                <button id="voice-record-btn" class="audio-btn" onclick="toggleVoiceRecording()"><i class="fa-solid fa-microphone"></i></button>
                <input type="text" id="chat-msg-input" placeholder="Mesajınızı yazın...">
                <button onclick="sendDirectMessage()">Göndər</button>
            </div>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="app-header">
            <div class="logo" id="profile-header-name">Profil</div>
            <div class="header-actions"><i class="fa-solid fa-arrow-right-from-bracket" onclick="logout()"></i></div>
        </div>
        <div class="profile-screen">
            <div class="profile-header">
                <img src="" id="my-profile-avatar" class="profile-avatar-main">
                <div class="profile-name-title" id="my-profile-name">İstifadəçi <span id="my-profile-badge"></span></div>
                <div class="profile-bio" id="my-profile-bio-text">Hələ heç bir bioqrafiya əlavə edilməyib.</div>
                
                <div class="profile-stats">
                    <div class="stat-item"><strong id="stat-posts-count">0</strong><span>Post</span></div>
                    <div class="stat-item"><strong id="stat-followers">0</strong><span>İzləyici</span></div>
                    <div class="stat-item"><strong id="stat-following">0</strong><span>İzlənilir</span></div>
                </div>
                <button id="admin-panel-btn" class="admin-trigger-btn" onclick="switchPage('admin')">⚙️ Admin Panelə Keç</button>
            </div>

            <div class="profile-edit-section">
                <h5 style="color:var(--accent-glow); font-size:12px; margin-bottom:5px;">PROFİLİ REDAKTƏ ET</h5>
                <input type="text" id="edit-bio-input" placeholder="Bioqrafiyanı yenilə...">
                <label class="file-upload-btn" style="padding: 6px; font-size:12px; margin:2px 0;">
                    🖼️ Profil Şəklini Dəyiş
                    <input type="file" id="edit-avatar-input" accept="image/*" style="display:none;" onchange="updateProfileAvatar(event)">
                </label>
                <button onclick="saveProfileBio()" style="padding:8px; background:var(--accent-blue); border:none; border-radius:6px; color:white; font-size:12px; font-weight:bold; cursor:pointer;">Məlumatları Saxla</button>
                <hr style="border:0; border-top:1px solid rgba(255,255,255,0.05); margin:5px 0;">
                <label class="file-upload-btn" style="padding: 8px; font-size:12px; background:#101b42; border-color:#9333ea;">
                    🔮 24s Story (Hekayə) Əlavə Et
                    <input type="file" id="story-file-input" accept="image/*" style="display:none;" onchange="uploadStory(event)">
                </label>
            </div>

            <div style="padding:10px 16px 0 16px; font-size:12px; font-weight:bold; color:var(--text-muted);">PAYLAŞIMLARIM</div>
            <div class="profile-posts-grid" id="my-posts-grid"></div>
        </div>
    </div>

    <div id="page-admin" class="page">
        <div class="app-header">
            <div class="logo">Nexa Control Panel</div>
            <div class="header-actions"><i class="fa-solid fa-xmark" onclick="switchPage('feed')"></i></div>
        </div>
        <div class="admin-screen">
            <div id="admin-users-list"></div>
        </div>
    </div>

    <div class="bottom-nav" id="app-navbar" style="display: none;">
        <div class="nav-btn active" onclick="switchPage('feed')" id="nav-feed"><i class="fa-solid fa-house"></i></div>
        <div class="nav-btn" onclick="switchPage('explore')" id="nav-explore"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-btn" onclick="switchPage('share')" id="nav-share"><i class="fa-solid fa-square-plus"></i></div>
        <div class="nav-btn" onclick="switchPage('reels')" id="nav-reels"><i class="fa-solid fa-clapperboard"></i></div>
        <div class="nav-btn" onclick="switchPage('profile')" id="nav-profile"><i class="fa-solid fa-user"></i></div>
    </div>

</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAWFpGs1CCKLQ3NL45o81nPCMuKRqLgJHM",
        authDomain: "nexa-51c08.firebaseapp.com",
        databaseURL: "https://nexa-51c08-default-rtdb.firebaseio.com",
        projectId: "nexa-51c08",
        storageBucket: "nexa-51c08.firebasestorage.app",
        messagingSenderId: "124010138329",
        appId: "1:124010138329:web:8c73c87483f2e28a5d8cc8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLogin = true;
    let currentUser = localStorage.getItem('nexa_user') || null;
    let currentSelectedFileBase64 = "";
    let currentSelectedFileType = "";
    let activeChatTarget = "";
    
    // Səs yazmaq üçün köməkçi dəyişənlər
    let mediaRecorder;
    let audioChunks = [];
    let isRecordingVoice = false;
    let storyTimeout = null;

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        const targetPage = document.getElementById('page-' + pageId);
        if(targetPage) targetPage.classList.add('active');
        
        const targetNav = document.getElementById('nav-' + pageId);
        if(targetNav) targetNav.classList.add('active');

        if(pageId === 'feed') { loadFeedData(); }
        if(pageId === 'profile') { loadMyProfile(); }
        if(pageId === 'explore') { handleSearch(); }
        if(pageId === 'reels') { loadReelsData(); }
        if(pageId === 'chatlist') { loadChatUsersList(); }
        if(pageId === 'admin') { loadAdminPanelData(); } // Admin funksiyası bura bağlandı!
    }

    function toggleMode() {
        isLogin = !isLogin;
        document.getElementById('title').innerText = isLogin ? "Giriş" : "Qeydiyyat";
        document.getElementById('btn').innerText = isLogin ? "Daxil ol" : "Qeydiyyatı tamamla";
        document.getElementById('toggle-text').innerText = isLogin ? "Hesabın yoxdur? Qeydiyyatdan keç" : "Artıq hesabın var? Daxil ol";
    }

    function authAction() {
        const u = document.getElementById('user').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        if(!u || !p) return alert("Bütün xanaları doldurun!");

        if (isLogin) {
            if(u === 'arifnazir2026' && p === 'arifnazir2007') {
                currentUser = u;
                localStorage.setItem('nexa_user', u);
                db.ref('users/' + u).setValue({ username: u, pass: p, verified: true, followers: 9999, following: 0, avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150", bio: "NEXA Baş Administrator" });
                document.getElementById('app-navbar').style.display = 'flex';
                switchPage('feed');
                return;
            }

            db.ref('users/' + u).once('value').then((snap) => {
                if (snap.exists() && snap.val().pass === p) {
                    currentUser = u;
                    localStorage.setItem('nexa_user', u);
                    document.getElementById('app-navbar').style.display = 'flex';
                    switchPage('feed');
                } else {
                    alert("İstifadəçi adı və ya şifrə yanlışdır!");
                }
            });
        } else {
            if(u === 'arifnazir2026') return alert("Bu özəl istifadəçi adı qeydiyyata qapalıdır!");
            db.ref('users/' + u).once('value').then(snap => {
                if(snap.exists()) {
                    alert("Bu istifadəçi adı artıq mövcuddur!");
                } else {
                    db.ref('users/' + u).set({
                        pass: p,
                        username: u,
                        verified: false,
                        followers: 0,
                        following: 0,
                        bio: "Nexa-da yeni rəqəmsal vətəndaş!",
                        avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150"
                    }).then(() => {
                        alert("Qeydiyyat uğurludur!");
                        toggleMode();
                    });
                }
            });
        }
    }

    function logout() {
        localStorage.removeItem('nexa_user');
        currentUser = null;
        document.getElementById('app-navbar').style.display = 'none';
        switchPage('auth');
    }

    // --- REALTIME MƏLUMAT AXINI & HESAB AYARLARI INTEGRASIYASI ---
    function loadFeedData() {
        // Real vaxtda 24 saatı keçməmiş hekayələri təmizlə və gətir
        const indi = Date.now();
        db.ref('stories').once('value', snap => {
            const storiesBox = document.getElementById('stories-box');
            storiesBox.innerHTML = "";
            
            // İlk olaraq şəxsi istifadəçi profilini story əlavə etmək üçün ən başa qoyuruq
            db.ref('users/' + currentUser).once('value', meSnap => {
                let me = meSnap.val() || {};
                storiesBox.innerHTML = `
                    <div class="story-wrapper" onclick="switchPage('profile')">
                        <div class="story-avatar-box" style="background: #101b42;"><img src="${me.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}"></div>
                        <span style="color:var(--accent-glow)">+ Sənin Story</span>
                    </div>
                `;

                if(snap.exists()) {
                    snap.forEach(storyChild => {
                        let sData = storyChild.val();
                        // 24 saatlıq (86400000 millisaniyə) yoxlanış linki
                        if(indi - sData.timestamp > 86400000) {
                            db.ref('stories/' + storyChild.key).remove(); // Köhnəlibsə bazadan avtomatik sil
                        } else {
                            storiesBox.innerHTML += `
                                <div class="story-wrapper" onclick="viewStory('${sData.author}', '${sData.media}', '${sData.avatar}')">
                                    <div class="story-avatar-box"><img src="${sData.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}"></div>
                                    <span>${sData.author}</span>
                                </div>
                            `;
                        }
                    });
                }
            });
        });

        // Həqiqi Postlar Axını
        db.ref('posts').on('value', (snapshot) => {
            const postsBox = document.getElementById('posts-box');
            postsBox.innerHTML = "";
            if(!snapshot.exists()) {
                postsBox.innerHTML = `<div style="text-align:center; margin-top:40px; color:var(--text-muted);">Hələ heç bir real paylaşım yoxdur.</div>`;
                return;
            }
            let data = snapshot.val();
            Object.keys(data).reverse().forEach(key => {
                let post = data[key];
                let mediaHtml = "";
                if(post.media) {
                    if(post.mediaType && post.mediaType.includes('video')) {
                        // Videoların səliqəli açılması üçün bütün zəruri parametrlər düzəldildi
                        mediaHtml = `<div class="post-media-container"><video src="${post.media}" class="post-media" controls playsinline preload="metadata"></video></div>`;
                    } else {
                        mediaHtml = `<div class="post-media-container"><img src="${post.media}" class="post-media"></div>`;
                    }
                }
                let tik = post.userVerified ? `<i class="fa-solid fa-circle-check mavi-tik"></i>` : '';
                postsBox.innerHTML += `
                    <div class="post-card">
                        <div class="post-header">
                            <div class="post-user-info">
                                <img src="${post.authorAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="post-user-img">
                                <div class="post-username">${post.author} ${tik}</div>
                            </div>
                        </div>
                        <div class="post-caption">${post.caption}</div>
                        ${mediaHtml}
                        <div class="post-actions">
                            <div class="action-item" onclick="likePost('${key}')"><i class="fa-regular fa-heart"></i> <span>${post.likes || 0}</span></div>
                        </div>
                    </div>
                `;
            });
        });
    }

    // --- STORY AYARLARI ---
    function uploadStory(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            db.ref('users/' + currentUser).once('value').then(userSnap => {
                let userData = userSnap.val() || {};
                db.ref('stories').push({
                    author: currentUser,
                    avatar: userData.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150",
                    media: e.target.result,
                    timestamp: Date.now()
                }).then(() => {
                    alert("Hekayəniz uğurla paylaşıldı və 24 saat ərzində görünəcək!");
                    loadFeedData();
                });
            });
        };
        reader.readAsDataURL(file);
    }

    function viewStory(author, media, avatar) {
        document.getElementById('story-viewer-name').innerText = "@" + author;
        document.getElementById('story-viewer-avatar').src = avatar;
        document.getElementById('story-viewer-img').src = media;
        document.getElementById('story-viewer').style.display = 'flex';
        
        const fill = document.getElementById('story-progress-fill');
        fill.style.width = '0%';
        setTimeout(() => { fill.style.width = '100%'; }, 50);

        storyTimeout = setTimeout(() => { closeStoryViewer(); }, 5000);
    }

    function closeStoryViewer() {
        document.getElementById('story-viewer').style.display = 'none';
        clearTimeout(storyTimeout);
    }

    // --- FILE SELECTION (POSTS) ---
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if(!file) return;
        currentSelectedFileType = file.type;
        document.getElementById('file-preview-status').innerText = "Fayl emal olunur, gözləyin...";
        
        const reader = new FileReader();
        reader.onload = function(e) {
            currentSelectedFileBase64 = e.target.result;
            document.getElementById('file-preview-status').innerText = "✅ Fayl hazır (" + file.name.substring(0,15) + "...)";
        };
        reader.readAsDataURL(file);
    }

    function submitPost() {
        const caption = document.getElementById('post-caption-input').value.trim();
        if(!caption && !currentSelectedFileBase64) return alert("Boş paylaşım etmək olmaz!");

        db.ref('users/' + currentUser).once('value').then(snap => {
            let uData = snap.val() || {};
            let isVerified = uData.verified || false;
            let currentAvatar = uData.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";

            const newPostRef = db.ref('posts').push();
            newPostRef.set({
                author: currentUser,
                authorAvatar: currentAvatar,
                caption: caption,
                media: currentSelectedFileBase64 || null,
                mediaType: currentSelectedFileType || null,
                likes: 0,
                userVerified: isVerified
            }).then(() => {
                alert("Paylaşıldı!");
                document.getElementById('post-caption-input').value = "";
                currentSelectedFileBase64 = "";
                currentSelectedFileType = "";
                document.getElementById('file-preview-status').innerText = "";
                switchPage('feed');
            });
        });
    }

    function likePost(key) {
        db.ref('posts/' + key + '/likes').transaction(c => (c || 0) + 1);
    }

    // --- REELS BÖLMƏSİ (VİDEOLAR) ---
    function loadReelsData() {
        const reelsBox = document.getElementById('reels-box');
        reelsBox.innerHTML = "";
        db.ref('posts').once('value', snap => {
            if(!snap.exists()) return;
            snap.forEach(child => {
                let post = child.val();
                if(post.media && post.mediaType && post.mediaType.includes('video')) {
                    reelsBox.innerHTML += `
                        <div class="reel-video-wrapper">
                            <video src="${post.media}" class="reel-video" autoplay loop muted playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                            <div class="reel-overlay">
                                <h3>@${post.author}</h3>
                                <p>${post.caption}</p>
                            </div>
                        </div>
                    `;
                }
            });
            if(reelsBox.innerHTML === "") {
                reelsBox.innerHTML = `<div style="text-align:center; padding-top:100px; color:var(--text-muted);">Hələ heç bir video reels yoxdur.</div>`;
            }
        });
    }

    // --- PROFILE BIO & AVATAR EDIT ---
    function updateProfileAvatar(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            db.ref('users/' + currentUser).update({ avatar: e.target.result }).then(() => {
                alert("Profil şəkli yeniləndi!");
                loadMyProfile();
            });
        };
        reader.readAsDataURL(file);
    }

    function saveProfileBio() {
        const bioTxt = document.getElementById('edit-bio-input').value.trim();
        db.ref('users/' + currentUser).update({ bio: bioTxt }).then(() => {
            alert("Bioqrafiya yadda saxlanıldı!");
            loadMyProfile();
        });
    }

    function loadMyProfile() {
        document.getElementById('profile-header-name').innerText = "@" + currentUser;
        
        if(currentUser === 'arifnazir2026') {
            document.getElementById('admin-panel-btn').style.display = "block";
        } else {
            document.getElementById('admin-panel-btn').style.display = "none";
        }

        db.ref('users/' + currentUser).on('value', snap => {
            if(!snap.exists()) return;
            let d = snap.val();
            document.getElementById('my-profile-avatar').src = d.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";
            document.getElementById('my-profile-bio-text').innerText = d.bio || "Hələ heç bir bioqrafiya əlavə edilməyib.";
            document.getElementById('edit-bio-input').value = d.bio || "";
            document.getElementById('stat-followers').innerText = d.followers || 0;
            document.getElementById('stat-following').innerText = d.following || 0;
            
            if(d.verified) {
                document.getElementById('my-profile-badge').innerHTML = `<i class="fa-solid fa-circle-check mavi-tik" style="font-size:16px;"></i>`;
            } else {
                document.getElementById('my-profile-badge').innerHTML = "";
            }
        });

        // Şəxsi Postlarımızın Profil Səhifəsində Görünməsi Funksiyası
        db.ref('posts').once('value').then(snap => {
            let count = 0;
            const gridBox = document.getElementById('my-posts-grid');
            gridBox.innerHTML = "";
            
            if(snap.exists()) {
                snap.forEach(p => { 
                    let post = p.val();
                    if(post.author === currentUser) {
                        count++;
                        if(post.media) {
                            if(post.mediaType && post.mediaType.includes('video')) {
                                gridBox.innerHTML += `<video src="${post.media}" class="grid-media-item" muted playsinline></video>`;
                            } else {

                            }

                            gridBox.innerHTML += `<div class="grid-media-item" style="background:var(--bg-box); display:flex; align-items:center; justify-content:center; padding:5px; font-size:10px; color:white; overflow:hidden; text-align:center;">${post.caption}</div>`;

                    }

            if(gridBox.innerHTML === "") {
                gridBox.innerHTML = `<div style="grid-column: 1/4; text-align:center; padding:20px; font-size:12px; color:var(--text-muted);">Heç bir paylaşımınız yoxdur.</div>`;
            }
        });
    }

    // --- ÇATDA SƏSLİ MESAJLAŞMA (AUDIO) SİSTEMİ ---
    function toggleVoiceRecording() {
        const btn = document.getElementById('voice-record-btn');
        if (!isRecordingVoice) {
            // Səs qeydini başlat
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        let base64Audio = reader.result;
                        sendAudioMessage(base64Audio);
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecordingVoice = true;
                btn.classList.add('recording');
                btn.innerHTML = `<i class="fa-solid fa-stop"></i>`;
            }).catch(err => { alert("Mikrofona icazə verilmədi və ya cihaz dəstəkləmir."); });
        } else {
            // Səs qeydini dayandır və göndər
            mediaRecorder.stop();
            isRecordingVoice = false;
            btn.classList.remove('recording');
            btn.innerHTML = `<i class="fa-solid fa-microphone"></i>`;
        }
    }

    function sendAudioMessage(base64Data) {
        let chatID = currentUser < activeChatTarget ? `${currentUser}_${activeChatTarget}` : `${activeChatTarget}_${currentUser}`;
        db.ref('messages/' + chatID).push({
            sender: currentUser,
            text: "[Səsli Mesaj]",
            audio: base64Data,
            timestamp: Date.now()
        });
    }

    // --- SƏSLİ VƏ GÖRÜNTÜLÜ ZƏNG SİMULYASİYASI ---
    function startCall(type) {
        db.ref('users/' + activeChatTarget).once('value', snap => {
            let target = snap.val() || {};
            document.getElementById('call-screen-img').src = target.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";
            document.getElementById('call-screen-name').innerText = "@" + activeChatTarget;
            document.getElementById('call-status-text').innerText = type === 'video' ? "Görüntülü Zəng Olunur..." : "Səsli Zəng Olunur...";
            
            const localVideo = document.getElementById('local-video-stream');
            if(type === 'video') {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localVideo.style.display = 'block';
                    localVideo.srcObject = stream;
                }).catch(e => console.log("Kamera aktivləşmədi."));
            } else {
                localVideo.style.display = 'none';
            }
            
            document.getElementById('call-screen').style.display = 'flex';
        });
    }

    function endSimulatedCall() {
        const localVideo = document.getElementById('local-video-stream');
        if(localVideo.srcObject) {
            localVideo.srcObject.getTracks().forEach(track => track.stop());
        }
        document.getElementById('call-screen').style.display = 'none';
    }

    // --- REALTIME CHAT MESAJ DINLƏYICI ---
    function listenMessages() {
        let chatID = currentUser < activeChatTarget ? `${currentUser}_${activeChatTarget}` : `${activeChatTarget}_${currentUser}`;
        db.ref('messages/' + chatID).on('value', snap => {
            const msgBox = document.getElementById('chat-messages-box');
            msgBox.innerHTML = "";
            if(!snap.exists()) return;
            snap.forEach(child => {
                let msg = child.val();
                let mClass = msg.sender === currentUser ? "sent" : "received";
                
                if(msg.audio) {
                    msgBox.innerHTML += `
                        <div class="msg-bubble ${mClass}" style="min-width:180px;">
                            <span style="font-size:10px; opacity:0.7; display:block; margin-bottom:4px;">🎵 Səsli mesaj</span>
                            <audio src="${msg.audio}" controls style="width:100%; height:30px;"></audio>
                        </div>`;
                } else {
                    msgBox.innerHTML += `<div class="msg-bubble ${mClass}">${msg.text}</div>`;
                }
            });
            msgBox.scrollTop = msgBox.scrollHeight;
        });
    }

    function sendDirectMessage() {
        const inp = document.getElementById('chat-msg-input');
        const txt = inp.value.trim();
        if(!txt) return;
        let chatID = currentUser < activeChatTarget ? `${currentUser}_${activeChatTarget}` : `${activeChatTarget}_${currentUser}`;
        db.ref('messages/' + chatID).push({
            sender: currentUser,
            text: txt,
            timestamp: Date.now()
        });
        inp.value = "";
    }

    function loadChatUsersList() {
        db.ref('users').once('value', snap => {
            const box = document.getElementById('chat-users-box');
            box.innerHTML = "";
            if(!snap.exists()) return;
            snap.forEach(child => {
                if(child.key === currentUser) return;
                let u = child.val();
                box.innerHTML += `
                    <div class="user-list-item" onclick="openChatWindow('${child.key}')" style="cursor:pointer;">
                        <div class="user-list-info">
                            <img src="${u.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" style="width:45px; height:45px; border-radius:50%; object-fit:cover; margin-right:12px;">
                            <div>
                                <strong>@${child.key}</strong>
                                <div style="font-size:12px; color:var(--text-muted);">${u.bio ? u.bio.substring(0,30) + '...' : 'Söhbətə başlamaq üçün toxunun'}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    }

    function openChatWindow(targetUser) {
        activeChatTarget = targetUser;
        document.getElementById('chat-target-title').innerText = "@" + targetUser;
        switchPage('chatwindow');
        listenMessages();
    }

    function handleSearch() {
        const query = document.getElementById('search-input-field').value.trim().toLowerCase();
        db.ref('users').once('value', snap => {
            const resBox = document.getElementById('search-results-box');
            resBox.innerHTML = "";
            if(!snap.exists()) return;

            snap.forEach(child => {
                let username = child.key;
                let u = child.val();
                if(username === currentUser) return; 
                if(query && !username.includes(query)) return;

                db.ref(`follows/${currentUser}/${username}`).once('value', followSnap => {
                    let isFollowing = followSnap.exists();
                    let btnText = isFollowing ? "Takipdəsən" : "Takip Et";
                    let btnClass = isFollowing ? "follow-btn following" : "follow-btn";

                    resBox.innerHTML += `
                        <div class="user-list-item">
                            <div class="user-list-info">
                                <img src="${u.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; margin-right:12px;">
                                <strong>@${username}</strong>
                            </div>
                            <button class="${btnClass}" onclick="toggleFollow('${username}', ${isFollowing})">${btnText}</button>
                        </div>
                    `;
                });
            });
        });
    }

    function toggleFollow(targetUser, isFollowing) {
        if(isFollowing) {
            db.ref(`follows/${currentUser}/${targetUser}`).remove();
            db.ref(`users/${currentUser}/following`).transaction(c => (c || 1) - 1);
            db.ref(`users/${targetUser}/followers`).transaction(c => (c || 1) - 1);
        } else {
            db.ref(`follows/${currentUser}/${targetUser}`).set(true);
            db.ref(`users/${currentUser}/following`).transaction(c => (c || 0) + 1);
            db.ref(`users/${targetUser}/followers`).transaction(c => (c || 0) + 1);
        }
        setTimeout(handleSearch, 400);
    }

    // --- ADMİN PANEL DETALLI PROSESLƏR (TAM DÜZƏLDİLDİ) ---
    function loadAdminPanelData() {
        db.ref('users').on('value', (snapshot) => {
            const container = document.getElementById('admin-users-list');
            container.innerHTML = "";
            if(!snapshot.exists()) return;
            snapshot.forEach(child => {
                let uName = child.key;
                let uData = child.val();
                let status = uData.verified ? `<span style="color:#38bdf8">Mavi Tikli</span>` : `Yoxdur`;
                container.innerHTML += `
                    <div class="user-manage-card">
                        <h4>@${uName}</h4>
                        <div class="admin-control-row">
                            <span>Status: <strong>${status}</strong></span>
                            <button class="admin-btn-sm" style="background:#0284c7; color:white;" onclick="setVerifyStatus('${uName}', ${!uData.verified})">Dəyiş</button>
                        </div>
                        <div class="admin-control-row">
                            <span>İzləyici:</span>
                            <div>
                                <input type="number" class="num-input" id="adm-fol-${uName}" value="${uData.followers || 0}">
                                <button class="admin-btn-sm" style="background:green; color:white;" onclick="admUpdateFollowers('${uName}')">Ok</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        });
    }

    function setVerifyStatus(username, status) {
        db.ref('users/' + username).update({ verified: status });
        db.ref('posts').once('value', snap => {
            if(snap.exists()) {
                snap.forEach(p => {
                    if(p.val().author === username) db.ref('posts/' + p.key).update({ userVerified: status });
                });
            }
        });
    }

    function admUpdateFollowers(username) {
        const val = parseInt(document.getElementById('adm-fol-' + username).value) || 0;
        db.ref('users/' + username).update({ followers: val });
    }

    window.onload = function() {
        if(currentUser) {
            document.getElementById('app-navbar').style.display = 'flex';
            switchPage('feed');
        } else {
            switchPage('auth');
        }
    }
</script>
</body>
</html>
