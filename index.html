<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FULL HORROR MODE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:black;
    overflow:hidden;
}

/* ekran shake + glitch */
.shake{
    animation:shake 0.08s infinite;
}

@keyframes shake{
    0%{transform:translate(0,0)}
    25%{transform:translate(6px,-6px)}
    50%{transform:translate(-6px,6px)}
    75%{transform:translate(6px,6px)}
    100%{transform:translate(0,0)}
}

/* qırmızı flash */
.flash{
    position:fixed;
    width:100%;
    height:100%;
    background:red;
    opacity:0;
    pointer-events:none;
    animation:flash 0.2s infinite;
}

@keyframes flash{
    0%{opacity:0}
    50%{opacity:0.15}
    100%{opacity:0}
}

/* yazı */
.text{
    position:absolute;
    font-size:34px;
    font-weight:bold;
    color:#ff0033;
    text-shadow:0 0 15px red;
    animation:fade 1.8s linear forwards;
}

@keyframes fade{
    0%{opacity:0;transform:scale(0.3)}
    20%{opacity:1;transform:scale(1.4)}
    100%{opacity:0;transform:scale(1.8)}
}

/* jumpscare */
.jumpscare{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
}

.jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>
</head>

<body class="shake">

<div class="flash"></div>

<!-- jumpscare şəkil -->
<div class="jumpscare" id="jump">
    <img src="https://i.imgur.com/4m7DTkF.jpeg" alt="scary">
</div>

<!-- səs -->
<audio id="sound" loop>
    <source src="scary.mp3" type="audio/mpeg">
</audio>

<script>

let started = false;

function start(){

    if(started) return;
    started = true;

    // səs
    document.getElementById("sound").play();

    // vibrasiya (telefon)
    if(navigator.vibrate){
        navigator.vibrate([500,200,500,200,1000]);
    }

    // spam text
    setInterval(spawnText, 90);

    // jumpscare təsadüfi
    setTimeout(()=>{
        showJumpscare();
    }, 4000);
}

function spawnText(){

    const el = document.createElement("div");
    el.className = "text";
    el.innerText = "Əlivə Verim";

    el.style.left = Math.random() * window.innerWidth + "px";
    el.style.top = Math.random() * window.innerHeight + "px";

    document.body.appendChild(el);

    setTimeout(()=> el.remove(), 1800);

    // vibrasiya spam
    if(navigator.vibrate){
        navigator.vibrate(80);
    }
}

function showJumpscare(){

    const j = document.getElementById("jump");
    j.style.display = "flex";

    // güclü vibrasiya
    if(navigator.vibrate){
        navigator.vibrate([300,100,300,100,300,500,1000]);
    }

    // 2 saniyə sonra bağla
    setTimeout(()=>{
        j.style.display = "none";
    }, 2000);
}

// klik ilə başlat
document.body.addEventListener("click", start, {once:true});

</script>

</body>
</html>
