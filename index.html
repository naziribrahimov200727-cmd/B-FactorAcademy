<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARK SIGNAL</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:black;
    overflow:hidden;
    color:white;
}

/* INTRO */

.start{
    position:fixed;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}

.start h1{
    color:red;
    font-size:45px;
    margin-bottom:20px;
    text-shadow:0 0 15px red;
}

.start button{
    padding:18px 45px;
    border:none;
    border-radius:15px;
    background:red;
    color:white;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 0 20px red;
}

/* MAIN TEXT */

.center{
    position:absolute;
    width:100%;
    top:40%;
    text-align:center;
    font-size:35px;
    font-weight:bold;
    text-shadow:0 0 15px red;
    animation:blink .4s infinite;
}

@keyframes blink{
    0%{opacity:1}
    50%{opacity:0}
    100%{opacity:1}
}

/* NOTIFICATION */

.note{
    position:absolute;
    left:20px;
    right:20px;
    background:#111;
    border:1px solid red;
    border-radius:14px;
    padding:18px;
    color:red;
    font-size:22px;
    box-shadow:0 0 15px red;
    animation:popup .4s;
}

@keyframes popup{
    from{
        transform:translateY(40px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* SHAKE */

.shake{
    animation:shake .08s infinite;
}

@keyframes shake{
    0%{transform:translate(0,0)}
    25%{transform:translate(4px,-4px)}
    50%{transform:translate(-4px,4px)}
    75%{transform:translate(4px,4px)}
    100%{transform:translate(0,0)}
}

/* VIRUS BAR */

.scan{
    position:fixed;
    bottom:0;
    left:0;
    width:0%;
    height:12px;
    background:red;
    box-shadow:0 0 20px red;
}

/* RED EYE */

.eye{
    position:fixed;
    width:180px;
    height:180px;
    border-radius:50%;
    background:red;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    box-shadow:
    0 0 40px red,
    0 0 80px red;
    display:none;
}

.eye::after{
    content:"";
    position:absolute;
    width:60px;
    height:60px;
    background:black;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

</style>
</head>

<body>

<!-- START -->

<div class="start" id="start">

    <h1>DARK SIGNAL</h1>

    <button onclick="startHorror()">
        ENTER
    </button>

</div>

<!-- CENTER TEXT -->

<div class="center" id="centerText">
</div>

<!-- SCAN BAR -->

<div class="scan" id="scan"></div>

<!-- RED EYE -->

<div class="eye" id="eye"></div>

<script>

const messages = [

"📍 UNKNOWN SIGNAL FOUND",
"⚠ DARK CONNECTION ACTIVE",
"👁 ENTITY DETECTED",
"🩸 DON'T TURN AROUND",
"🚪 Qapını açma",
"👁 Səni görürəm",
"⚠ Arxana bax"

];

function startHorror(){

    document.getElementById("start").style.display = "none";

    document.body.classList.add("shake");

    if(navigator.vibrate){
        navigator.vibrate([300,100,300,100,700]);
    }

    // fake location
    showCenter(
    "📍 LOCATION: "
    + randomCoord()
    );

    // notifications
    setInterval(spawnNote,1200);

    // fake scanner
    fakeScan();

    // blackout + eye
    setTimeout(()=>{
        blackout();
    },12000);
}

function randomCoord(){

    let a =
    (Math.random()*180-90).toFixed(5);

    let b =
    (Math.random()*360-180).toFixed(5);

    return a + ", " + b;
}

function showCenter(txt){

    const c =
    document.getElementById("centerText");

    c.innerText = txt;
}

function spawnNote(){

    const el =
    document.createElement("div");

    el.className = "note";

    el.innerText =
    messages[
    Math.floor(Math.random()*messages.length)
    ];

    el.style.top =
    Math.random() *
    (window.innerHeight-120)
    + "px";

    document.body.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },3000);

    if(navigator.vibrate){
        navigator.vibrate(80);
    }
}

function fakeScan(){

    let width = 0;

    const bar =
    document.getElementById("scan");

    const interval =
    setInterval(()=>{

        width += 1;

        bar.style.width =
        width + "%";

        showCenter(
        "⚠ " + width +
        "% SCANNING..."
        );

        if(width >= 100){

            clearInterval(interval);

            showCenter(
            "⚠ 12 THREATS FOUND"
            );
        }

    },80);
}

function blackout(){

    document.body.innerHTML = "";

    document.body.style.background = "black";

    const eye =
    document.createElement("div");

    eye.className = "eye";

    document.body.appendChild(eye);

    eye.style.display = "block";

    if(navigator.vibrate){
        navigator.vibrate(
        [400,100,400,100,1000]
        );
    }
}

</script>

</body>
</html>
