<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>eBay Watch Notification</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
}

.watch{
    width:320px;
    height:390px;
    background:#111;
    border-radius:45px;
    border:10px solid #222;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.7);
    position:relative;
}

.screen{
    width:100%;
    height:100%;
    background:linear-gradient(to bottom,#000,#1b1b1b);
    position:relative;
    padding:20px;
}

.time{
    color:white;
    font-size:48px;
    text-align:center;
    margin-top:20px;
    font-weight:bold;
}

.date{
    color:#888;
    text-align:center;
    margin-top:5px;
    font-size:14px;
}

.notification{
    position:absolute;
    left:15px;
    right:15px;
    bottom:-220px;
    background:#1f1f1f;
    border-radius:22px;
    padding:18px;
    border:1px solid #333;
    animation:popup 6s infinite;
}

.top{
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

.logo{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#e53238;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    margin-right:10px;
}

.app{
    color:white;
    font-size:16px;
    font-weight:bold;
}

.message{
    color:white;
    font-size:18px;
    line-height:1.5;
}

.price{
    color:#00ff99;
    margin-top:12px;
    font-size:20px;
    font-weight:bold;
}

@keyframes popup{

    0%{
        bottom:-220px;
        opacity:0;
    }

    15%{
        bottom:20px;
        opacity:1;
    }

    70%{
        bottom:20px;
        opacity:1;
    }

    100%{
        bottom:-220px;
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="watch">

    <div class="screen">

        <div class="time" id="time">
            12:45
        </div>

        <div class="date">
            Friday, May 22
        </div>

        <div class="notification">

            <div class="top">

                <div class="logo">
                    e
                </div>

                <div class="app">
                    eBay
                </div>

            </div>

            <div class="message">
                💸 Əlivə Verim
            </div>

            <div class="price">
                + $247.99
            </div>

        </div>

    </div>

</div>

<script>

function updateTime(){

    let now = new Date();

    let hours = now.getHours().toString().padStart(2,"0");
    let minutes = now.getMinutes().toString().padStart(2,"0");

    document.getElementById("time").innerHTML =
    `${hours}:${minutes}`;
}

setInterval(updateTime,1000);

updateTime();

</script>

</body>
</html>
