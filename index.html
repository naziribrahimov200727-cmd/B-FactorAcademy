<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa | Official</title>
    <style>
        :root { --bg: #000; --nav: #000; --text: #fff; --border: #262626; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* Üst Navbar */
        .top-nav { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
        .logo { font-family: cursive; font-size: 24px; font-weight: bold; }

        /* Story */
        .story-bar { display: flex; gap: 15px; padding: 15px; overflow-x: auto; border-bottom: 1px solid var(--border); }
        .story-item { text-align: center; font-size: 12px; }
        .story-img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #f00; padding: 2px; }

        /* Post */
        .post { max-width: 470px; margin: 0 auto 20px; }
        .post-header { display: flex; align-items: center; padding: 10px; gap: 10px; }
        .user-pic { width: 32px; height: 32px; background: #333; border-radius: 50%; }
        .post-img { width: 100%; aspect-ratio: 1/1; background: #1a1a1a; }
        .post-actions { padding: 10px; display: flex; gap: 15px; font-size: 24px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--nav); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="top-nav">
        <div class="logo">Nexa</div>
        <div style="font-size: 24px;">♥</div>
    </nav>

    <!-- Stories -->
    <div class="story-bar">
        <div class="story-item"><div class="story-img" style="background:#555"></div>Sən</div>
        <div class="story-item"><div class="story-img" style="background:#888"></div>Ayhan</div>
        <div class="story-item"><div class="story-img" style="background:#aaa"></div>Könül</div>
    </div>

    <!-- Feed -->
    <div id="feed">
        <article class="post">
            <div class="post-header">
                <div class="user-pic"></div>
                <strong>Nexa_Official</strong>
            </div>
            <div class="post-img"></div>
            <div class="post-actions">
                <span>♥</span> <span>💬</span> <span>✈</span>
            </div>
            <div style="padding: 0 10px;"><strong>Nexa_Official</strong> Nexa dünyasına xoş gəldiniz! 🚀</div>
        </article>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <span>🏠</span> <span>🔍</span> <span>➕</span> <span>⚡</span> <span>👤</span>
    </nav>

</body>
</html>
