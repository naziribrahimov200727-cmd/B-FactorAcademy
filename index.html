<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA - Giriş və Qeydiyyat</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        body { background: #030712; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 90%; max-width: 320px; background: #0b1329; padding: 25px; border-radius: 20px; border: 1px solid #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111c44; border: 1px solid #3b82f6; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2 id="title" style="text-align:center;">Giriş</h2>
    <input type="text" id="user" placeholder="İstifadəçi adı">
    <input type="password" id="pass" placeholder="Şifrə">
    <button onclick="authAction()" id="btn">Daxil ol</button>
    <p onclick="toggleMode()" style="font-size: 13px; cursor: pointer; color: #3b82f6; text-align: center; margin-top: 15px;">Qeydiyyatdan keç</p>
</div>

<script>
    // Sənin Firebase konfiqurasiyan
    const firebaseConfig = {
        apiKey: "AIzaSyAWFpGs1CCKLQ3NL45o81nPCMuKRqLgJHM",
        authDomain: "nexa-51c08.firebaseapp.com",
        databaseURL: "https://nexa-51c08-default-rtdb.firebaseio.com",
        projectId: "nexa-51c08",
        storageBucket: "nexa-51c08.firebasestorage.app",
        messagingSenderId: "124010138329",
        appId: "1:124010138329:web:8c73c87483f2e28a5d8cc8"
    };

    // Firebase-i işə sal
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLogin = true;

    function toggleMode() {
        isLogin = !isLogin;
        document.getElementById('title').innerText = isLogin ? "Giriş" : "Qeydiyyat";
        document.getElementById('btn').innerText = isLogin ? "Daxil ol" : "Qeydiyyatı tamamla";
    }

    function authAction() {
        const u = document.getElementById('user').value.trim();
        const p = document.getElementById('pass').value;
        if(!u || !p) return alert("Boş xana qoymayın!");
        
        const userRef = db.ref('users/' + u);

        if (!isLogin) {
            // Qeydiyyat
            userRef.set({ pass: p }).then(() => {
                alert("Qeydiyyat uğurludur!");
                toggleMode();
            }).catch(e => alert("Xəta: " + e.message));
        } else {
            // Giriş
            userRef.once('value').then((snap) => {
                if (snap.exists() && snap.val().pass === p) {
                    alert("Xoş gəldin, " + u + "!");
                } else {
                    alert("İstifadəçi adı və ya şifrə yanlışdır!");
                }
            });
        }
    }
</script>
</body>
</html>
