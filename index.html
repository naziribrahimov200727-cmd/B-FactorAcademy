<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa v1</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:white}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:10px;
}
.login-box{
  background:#1c1c1c;
  padding:30px;
  border-radius:15px;
  width:300px;
}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}
button{
  width:100%;
  padding:10px;
  background:#ff2d55;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* APP */
.app{display:none}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#151515;
  position:sticky;
  top:0;
}

/* STORIES */
.stories{
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
}
.story{
  min-width:60px;
  text-align:center;
}
.story-circle{
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid #ff2d55;
}

/* POST */
.post{
  background:#1c1c1c;
  margin:10px;
  border-radius:10px;
  overflow:hidden;
}
.post img{
  width:100%;
}
.post-info{
  padding:10px;
}

/* POST CREATE */
.create-post{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#ff2d55;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  cursor:pointer;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}
.modal-content{
  background:#1c1c1c;
  padding:20px;
  width:300px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-box">
    <h2>Nexa Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Daxil ol</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <div class="topbar">
    <h2>NEXA</h2>
    <span>🔔</span>
  </div>

  <!-- STORIES -->
  <div class="stories">
    <div class="story"><div class="story-circle"></div><small>Ali</small></div>
    <div class="story"><div class="story-circle"></div><small>Veli</small></div>
    <div class="story"><div class="story-circle"></div><small>Nigar</small></div>
    <div class="story"><div class="story-circle"></div><small>Elvin</small></div>
  </div>

  <!-- POSTS -->
  <div id="feed">
    <div class="post">
      <img src="https://picsum.photos/400/300" />
      <div class="post-info">
        <b>nexa_user</b>
        <p>First post on Nexa 🚀</p>
      </div>
    </div>
  </div>

</div>

<!-- CREATE POST -->
<div class="create-post" onclick="openModal()">+</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Post yarat</h3>
    <input id="caption" placeholder="Caption">
    <input id="img" placeholder="Image URL">
    <button onclick="addPost()">Paylaş</button>
    <button onclick="closeModal()" style="margin-top:10px;background:#333;">Bağla</button>
  </div>
</div>

<script>
function login(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
}

function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function addPost(){
  let caption=document.getElementById("caption").value;
  let img=document.getElementById("img").value;

  if(!img) img="https://picsum.photos/400/300";

  let post=document.createElement("div");
  post.className="post";
  post.innerHTML=`
    <img src="${img}">
    <div class="post-info">
      <b>sən</b>
      <p>${caption}</p>
    </div>
  `;

  document.getElementById("feed").prepend(post);

  closeModal();
}
</script>

</body>
</html>
