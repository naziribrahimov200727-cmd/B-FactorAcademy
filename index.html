<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini WhatsApp</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b141a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main container */
.chat-box {
    width: 360px;
    height: 600px;
    background: #111b21;
    display: flex;
    flex-direction: column;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* Header */
.header {
    background: #202c33;
    padding: 15px;
    color: white;
    font-weight: bold;
}

/* Messages */
.messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

.msg {
    padding: 8px 12px;
    margin: 5px 0;
    border-radius: 10px;
    max-width: 70%;
    word-wrap: break-word;
}

.me {
    background: #005c4b;
    color: white;
    margin-left: auto;
}

.bot {
    background: #202c33;
    color: white;
    margin-right: auto;
}

/* Input */
.input-box {
    display: flex;
    padding: 10px;
    background: #202c33;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 5px;
    outline: none;
}

button {
    margin-left: 8px;
    background: #00a884;
    border: none;
    color: white;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background: #008f6f;
}
</style>
</head>

<body>

<div class="chat-box">
    <div class="header">💬 Mini WhatsApp</div>

    <div class="messages" id="messages"></div>

    <div class="input-box">
        <input type="text" id="input" placeholder="Mesaj yaz...">
        <button onclick="sendMessage()">Göndər</button>
    </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("input");
    let msgText = input.value.trim();

    if (msgText === "") return;

    let messages = document.getElementById("messages");

    // User message
    let msg = document.createElement("div");
    msg.className = "msg me";
    msg.innerText = msgText;
    messages.appendChild(msg);

    input.value = "";

    messages.scrollTop = messages.scrollHeight;

    // Bot auto reply (demo)
    setTimeout(() => {
        let bot = document.createElement("div");
        bot.className = "msg bot";
        bot.innerText = "✔ Mesaj alındı!";
        messages.appendChild(bot);
        messages.scrollTop = messages.scrollHeight;
    }, 500);
}
</script>

</body>
</html>
