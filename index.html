<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa | Rəqəmsal Ev</title>
    <style>
        :root { --bg: #000; --accent: #ff0050; --border: #333; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 70px; }
        .view { display: none; padding: 15px; }
        .active { display: block; }
        
        /* Post Dizaynı (image.png-dən ilhamlanaraq) */
        .post { background: #111; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .user-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #444; }
        .post-media { width: 100%; height: 250px; background: #222; border-radius: 10px; }

        /* Navigasiya */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 15px 0; }
        .btn { padding: 10px 20px; background: var(--accent); border: none; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Ana Səhifə (Feed) -->
    <div id="home" class="view active">
        <h2>Ana Səhifə</h2>
        <div class="post">
            <div class="user-header"><div class="avatar"></div><strong>Aylin_97</strong></div>
            <div class="post-media"></div>
            <p>Bakının gözəlliyi ✨🇦🇿</p>
        </div>
    </div>

    <!-- Axtarış -->
    <div id="search" class="view">
        <h2>Axtarış</h2>
        <input type="text" placeholder="İnsanları axtar..." style="width: 100%; padding: 10px; border-radius: 5px;">
    </div>

    <!-- Profil -->
    <div id="profile" class="view">
        <div style="text-align:center;">
            <div class="avatar" style="width:100px; height:100px; margin:auto;"></div>
            <h1>İstifadəçi Adı</h1>
            <button class="btn" onclick="alert('Dostluq istəyi göndərildi!')">Dostluq At</button>
        </div>
    </div>

    <!-- Mesajlar -->
    <div id="messages" class="view">
        <h2>Mesajlar</h2>
        <div style="padding:10px; border-bottom:1px solid #333;">Könül: Salam, necəsən?</div>
        <div style="padding:10px; border-bottom:1px solid #333;">Ayhan: Videonu gördün?</div>
    </div>

    <!-- Navigasiya -->
    <nav class="bottom-nav">
        <span onclick="show('home')">🏠</span>
        <span onclick="show('search')">🔍</span>
        <span onclick="show('profile')">👤</span>
        <span onclick="show('messages')">💬</span>
    </nav>

    <script>
        function show(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
