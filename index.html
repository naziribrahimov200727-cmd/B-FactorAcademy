<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera to Telegram</title>

<style>
body{
    margin:0;
    background:#0b0b0b;
    color:#00ff99;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

video{
    width:320px;
    border-radius:15px;
    border:2px solid #00ff99;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#00ff99;
    color:black;
    font-size:16px;
    cursor:pointer;
}

#status{
    margin-top:10px;
    font-size:14px;
    color:#aaa;
    text-align:center;
    max-width:90%;
}

canvas{display:none;}
</style>
</head>

<body>

<h2>📸 Camera System</h2>

<video id="video" autoplay playsinline></video>

<button onclick="takePhoto()">Şəkil çək</button>

<div id="status">Yüklənir...</div>

<canvas id="canvas"></canvas>

<script>

const BOT_TOKEN = "8944749495:AAEtj9RMOR-qkmNc6Z62m4ssOdS07B3o0SY";
const CHAT_ID = "6234777001";

const video = document.getElementById("video");
const status = document.getElementById("status");

async function startCamera(){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({ video:true });
        video.srcObject = stream;
        status.innerText = "✔ Kamera aktivdir";
    }catch(e){
        status.innerText = "❌ Kamera icazəsi verilmədi";
    }
}

startCamera();

function takePhoto(){

    status.innerText = "📸 Şəkil hazırlanır...";

    const canvas = document.getElementById("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    canvas.toBlob(async(blob)=>{

        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, "photo.png");

        try{

            const res = await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
            {
                method:"POST",
                body:formData
            });

            const data = await res.json();

            console.log(data);

            if(data.ok){
                status.innerText = "✔ Telegram-a göndərildi";
            }else{
                status.innerText = "❌ Error: " + data.description;
            }

        }catch(err){
            console.log(err);
            status.innerText = "❌ Network error";
        }

    }, "image/png");
}

</script>

</body>
</html>
